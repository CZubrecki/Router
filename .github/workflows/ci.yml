name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: RouterCore (macOS, swift test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build RouterCore
        run: swift build --product RouterCore
      - name: Check RouterCore is SwiftUI-free
        run: scripts/check-core-swiftui-free.sh
      - name: Test with coverage gate
        run: scripts/check-coverage.sh 90

  ui:
    name: RouterUI (iOS simulator, xcodebuild test)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test on iOS simulator
        run: |
          simulator="$(scripts/ios-simulator-id.sh)"
          xcodebuild test \
            -scheme Router-Package \
            -destination "platform=iOS Simulator,id=$simulator"

  docs:
    name: DocC
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build documentation
        run: |
          xcodebuild docbuild -scheme RouterCore -destination 'generic/platform=macOS' -derivedDataPath .build/docs
          xcodebuild docbuild -scheme RouterUI -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/docs
          mkdir -p docs-out
          find .build/docs/Build/Products -maxdepth 2 -name '*.doccarchive' -exec cp -R {} docs-out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: docc
          path: docs-out
